<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Presupuesto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; display: flex; justify-content: center; }
        .container { max-width: 700px; width: 100%; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 20px; color: #1a252f; }
        
        .resumen { display: flex; gap: 15px; margin-bottom: 25px; }
        .card { flex: 1; padding: 15px; border-radius: 8px; text-align: center; background: #eef2f5; }
        .card h3 { font-size: 14px; color: #666; margin-bottom: 5px; }
        .card p { font-size: 18px; font-weight: bold; }
        .ingreso-val { color: #27ae60; }
        .egreso-val { color: #e74c3c; }
        .balance-val { color: #2980b9; }

        form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 25px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #219150; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #555; }
        .btn-eliminar { background-color: #e74c3c; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-eliminar:hover { background-color: #c0392b; }
        
        @media (max-width: 600px) {
            form { grid-template-columns: 1fr; }
            .resumen { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Control de Presupuesto</h1>

        <!-- RESUMEN EN TIEMPO REAL -->
        <div class="resumen">
            <div class="card">
                <h3>INGRESOS</h3>
                <p id="totalIngresos" class="ingreso-val">$0.00</p>
            </div>
            <div class="card">
                <h3>EGRESOS</h3>
                <p id="totalEgresos" class="egreso-val">$0.00</p>
            </div>
            <div class="card">
                <h3>DISPONIBLE</h3>
                <p id="totalBalance" class="balance-val">$0.00</p>
            </div>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="formPresupuesto">
            <input type="text" id="descripcion" placeholder="Descripción (ej. Renta, Sueldo)" required>
            <input type="number" id="monto" step="0.01" placeholder="Monto" required>
            <select id="tipo">
                <option value="ingreso">Ingreso (+)</option>
                <option value="egreso">Egreso (-)</option>
            </select>
            <button type="submit">Guardar</button>
        </form>

        <!-- TABLA DE MOVIMIENTOS -->
        <table>
            <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Tipo</th>
                    <th>Monto</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">
                <!-- Se dibuja mediante JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- SCRIPT CON GUARDADO AUTOMÁTICO (LOCALSTORAGE) -->
    <script>
        // 1. OBTENER REGISTROS DE LOCALSTORAGE O INICIAR VACÍO
        let registros = JSON.parse(localStorage.getItem('tesoreria_presupuesto_datos')) || [];

        const form = document.getElementById('formPresupuesto');
        const descInput = document.getElementById('descripcion');
        const montoInput = document.getElementById('monto');
        const tipoSelect = document.getElementById('tipo');
        const tablaCuerpo = document.getElementById('tablaCuerpo');

        // 2. FUNCIÓN PARA GUARDAR CAMBIOS PERMANENTEMENTE
        function sincronizarStorage() {
            localStorage.setItem('tesoreria_presupuesto_datos', JSON.stringify(registros));
        }

        // 3. RENDERIZAR INTERFAZ
        function actualizarUI() {
            tablaCuerpo.innerHTML = '';
            let ingresos = 0;
            let egresos = 0;

            registros.forEach((item, index) => {
                const monto = parseFloat(item.monto);
                
                if (item.tipo === 'ingreso') {
                    ingresos += monto;
                } else {
                    egresos += monto;
                }

                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${item.descripcion}</td>
                    <td style="color: ${item.tipo === 'ingreso' ? '#27ae60' : '#e74c3c'}">${item.tipo.toUpperCase()}</td>
                    <td>$${monto.toFixed(2)}</td>
                    <td>
                        <button class="btn-eliminar" onclick="eliminarFila(${index})">Eliminar</button>
                    </td>
                `;
                tablaCuerpo.appendChild(fila);
            });

            // Actualizar tarjetas
            document.getElementById('totalIngresos').textContent = `$${ingresos.toFixed(2)}`;
            document.getElementById('totalEgresos').textContent = `$${egresos.toFixed(2)}`;
            document.getElementById('totalBalance').textContent = `$${(ingresos - egresos).toFixed(2)}`;
        }

        // 4. EVENTO AGREGAR REGISTRO
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const nuevoItem = {
                descripcion: descInput.value,
                monto: parseFloat(montoInput.value),
                tipo: tipoSelect.value
            };

            registros.push(nuevoItem);
            sincronizarStorage(); // <--- GUARDA AL AGREGAR
            actualizarUI();

            form.reset();
        });

        // 5. EVENTO ELIMINAR REGISTRO
        window.eliminarFila = function(index) {
            registros.splice(index, 1);
            sincronizarStorage(); // <--- GUARDA AL ELIMINAR
            actualizarUI();
        };

        // 6. CARGAR DATOS EN PANTALLA AL REFRESCAR LA PÁGINA (F5)
        document.addEventListener('DOMContentLoaded', actualizarUI);
    </script>
</body>
</html>
