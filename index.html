<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Presupuesto</title>

  <!-- Tailwind CSS para diseño moderno y limpio -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-6xl mx-auto space-y-6">
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h1 class="text-2xl font-bold text-slate-800">Módulo de Presupuesto con Desglose</h1>
      <p class="text-slate-500 text-sm">Registra conceptos específicos para calcular automáticamente los totales por cuenta de catálogo.</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- FORMULARIO DE REGISTRO -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-800 mb-4">Agregar Concepto al Presupuesto</h2>
        <form id="budgetForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Cuenta / Catálogo</label>
            <select id="cuentaSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
              <option value="">Selecciona una cuenta...</option>
              <option value="123">123 - Mantenimiento de maquinaria</option>
              <option value="456">456 - Papelería y artículos de oficina</option>
              <option value="789">789 - Servicios de cómputo y TI</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Concepto / Detalle</label>
            <input type="text" id="conceptoInput" placeholder="Ej. Cambio de fixture" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Monto Presupuestado ($)</label>
            <input type="number" step="0.01" id="montoInput" placeholder="Ej. 1000" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm">
            + Agregar al Presupuesto
          </button>
        </form>
      </section>

      <!-- VISTA DE RESUMEN Y DESGLOSE -->
      <section class="lg:col-span-2 space-y-4">
        
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-semibold text-slate-800">Resumen y Desglose de Cuentas</h2>
          <span id="grandTotal" class="text-xl font-bold text-blue-600">Total General: $0.00</span>
        </div>

        <div id="cuentasContainer" class="space-y-4">
          <!-- Las tarjetas de cada cuenta se generan dinámicamente aquí -->
        </div>

      </section>

    </div>
  </div>

  <script>
    // Base de datos local provisional
    let presupuestoItems = [
      { id: 1, cuentaId: "123", cuentaNombre: "123 - Mantenimiento de maquinaria", concepto: "Cambio de fixture", monto: 1000 },
      { id: 2, cuentaId: "123", cuentaNombre: "123 - Mantenimiento de maquinaria", concepto: "Compra de báscula", monto: 6000 }
    ];

    const budgetForm = document.getElementById('budgetForm');
    const cuentasContainer = document.getElementById('cuentasContainer');
    const grandTotalEl = document.getElementById('grandTotal');

    // Función para renderizar la información
    function renderPresupuesto() {
      cuentasContainer.innerHTML = '';

      if (presupuestoItems.length === 0) {
        cuentasContainer.innerHTML = `<div class="p-8 text-center bg-white rounded-xl border border-dashed border-slate-300 text-slate-400">No hay partidas presupuestadas aún.</div>`;
        grandTotalEl.textContent = `Total General: $0.00`;
        return;
      }

      // Agrupar items por código de cuenta
      const agrupado = presupuestoItems.reduce((acc, item) => {
        if (!acc[item.cuentaId]) {
          acc[item.cuentaId] = {
            nombre: item.cuentaNombre,
            total: 0,
            detalles: []
          };
        }
        acc[item.cuentaId].total += item.monto;
        acc[item.cuentaId].detalles.push(item);
        return acc;
      }, {});

      let totalGeneral = 0;

      // Renderizar cada grupo/cuenta
      Object.keys(agrupado).forEach(cuentaId => {
        const grupo = agrupado[cuentaId];
        totalGeneral += grupo.total;

        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";

        let detallesHTML = grupo.detalles.map(d => `
          <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
            <td class="py-2.5 px-4 text-slate-700">${d.concepto}</td>
            <td class="py-2.5 px-4 text-right font-medium text-slate-900">$${d.monto.toLocaleString('es-MX', {minimumFractionDigits: 2})}</td>
            <td class="py-2.5 px-4 text-center">
              <button onclick="eliminarItem(${d.id})" class="text-xs text-red-500 hover:text-red-700 font-medium">Eliminar</button>
            </td>
          </tr>
        `).join('');

        card.innerHTML = `
          <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
            <span class="font-bold">${grupo.nombre}</span>
            <span class="text-lg font-bold text-green-400">$${grupo.total.toLocaleString('es-MX', {minimumFractionDigits: 2})}</span>
          </div>
          <div class="p-2">
            <table class="w-full text-sm text-left">
              <thead class="text-xs text-slate-400 uppercase border-b border-slate-200">
                <tr>
                  <th class="py-2 px-4">Concepto / Elemento</th>
                  <th class="py-2 px-4 text-right">Monto</th>
                  <th class="py-2 px-4 text-center">Acción</th>
                </tr>
              </thead>
              <tbody>
                ${detallesHTML}
              </tbody>
            </table>
          </div>
        `;

        cuentasContainer.appendChild(card);
      });

      grandTotalEl.textContent = `Total General: $${totalGeneral.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
    }

    // Agregar nuevo concepto
    budgetForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const select = document.getElementById('cuentaSelect');
      const conceptoInput = document.getElementById('conceptoInput');
      const montoInput = document.getElementById('montoInput');

      const newItem = {
        id: Date.now(),
        cuentaId: select.value,
        cuentaNombre: select.options[select.selectedIndex].text,
        concepto: conceptoInput.value,
        monto: parseFloat(montoInput.value)
      };

      presupuestoItems.push(newItem);
      
      conceptoInput.value = '';
      montoInput.value = '';

      renderPresupuesto();
    });

    // Eliminar un concepto específico
    function eliminarItem(id) {
      presupuestoItems = presupuestoItems.filter(item => item.id !== id);
      renderPresupuesto();
    }

    // Carga inicial de datos de ejemplo
    renderPresupuesto();
  </script>
</body>
</html>
